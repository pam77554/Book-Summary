<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Summary</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #fffbef;
      color: #3d2b1f;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28pt;
      color: #3d2b1f;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7B6D8D;
      font-size: 13px;
      margin-bottom: 36px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 15px;
      font-family: Georgia, serif;
      border: 1.5px solid #c5b8a8;
      border-radius: 4px;
      background: #fff;
      color: #3d2b1f;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1B2A4A;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    button {
      padding: 10px 20px;
      font-size: 14px;
      font-family: Georgia, serif;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.15s;
    }

    .btn-characters { background: #1B2A4A; color: white; }
    .btn-characters:hover { background: #2a3f6a; }

    .btn-synopsis { background: #4A7C59; color: white; }
    .btn-synopsis:hover { background: #3a6147; }

    .btn-spoilers { background: #7B6D8D; color: white; }
    .btn-spoilers:hover { background: #63577a; }

    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .result-box {
      background: white;
      border: 1.5px solid #c5b8a8;
      border-radius: 6px;
      padding: 24px;
      min-height: 120px;
      line-height: 1.7;
      font-size: 15px;
      display: none;
    }

    .result-box.visible { display: block; }

    .result-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7B6D8D;
      margin-bottom: 12px;
      font-family: Arial, sans-serif;
    }

    .result-text {
      white-space: pre-wrap;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #3d2b1f;
      animation: blink 0.7s infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .api-section {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid #e0d8cc;
      font-size: 12px;
      color: #999;
    }

    .api-section a {
      color: #7B6D8D;
      cursor: pointer;
      text-decoration: underline;
    }

    .api-key-row {
      display: none;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .api-key-row.visible { display: flex; }

    .api-key-row input {
      flex: 1;
      padding: 6px 10px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      border: 1px solid #c5b8a8;
      border-radius: 4px;
    }

    .api-key-row button {
      padding: 6px 14px;
      font-size: 12px;
      font-weight: normal;
      background: #1B2A4A;
      color: white;
      font-family: Arial, sans-serif;
    }

    .key-status {
      color: #4A7C59;
      font-size: 12px;
      margin-top: 4px;
    }

    .error {
      color: #c0392b;
      font-size: 13px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Book Summary</h1>
    <p class="subtitle">Enter a book title and choose what you'd like to know</p>

    <div class="input-row">
      <input type="text" id="bookTitle" placeholder="Enter book title..." />
    </div>

    <div id="errorMsg" class="error" style="display:none"></div>

    <div class="buttons">
      <button class="btn-characters" onclick="query('characters')">List of Characters</button>
      <button class="btn-synopsis" onclick="query('synopsis')">Synopsis</button>
      <button class="btn-spoilers" onclick="query('spoilers')">Full Summary with Spoilers</button>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-label" id="resultLabel"></div>
      <div class="result-text" id="resultText"></div>
    </div>

    <div class="api-section">
      <span id="keyInfo"></span>
      <a onclick="toggleKeyInput()">API key settings</a>
      <div class="api-key-row" id="keyRow">
        <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
        <button onclick="saveKey()">Save</button>
      </div>
    </div>
  </div>

  <script>
    const PROMPTS = {
      characters: (title) =>
        `List the main and supporting characters in "${title}". For each character provide their name and a brief description of who they are and their role in the story. Do not include any plot spoilers — just who the characters are.`,
      synopsis: (title) =>
        `Give a brief synopsis of "${title}" in 2-3 paragraphs. Give a general overview of the story without revealing major plot twists or the ending.`,
      spoilers: (title) =>
        `Give a detailed summary of "${title}" including all major plot points, character arcs, key twists, and the ending. Include spoilers.`,
    };

    const LABELS = {
      characters: 'Characters (no spoilers)',
      synopsis: 'Synopsis',
      spoilers: 'Full Summary with Spoilers',
    };

    function getKey() {
      return localStorage.getItem('bookSummaryApiKey') || '';
    }

    function updateKeyStatus() {
      const key = getKey();
      document.getElementById('keyInfo').textContent = key
        ? 'API key saved. '
        : 'No API key saved. ';
    }

    function toggleKeyInput() {
      const row = document.getElementById('keyRow');
      row.classList.toggle('visible');
      if (row.classList.contains('visible')) {
        document.getElementById('apiKeyInput').value = getKey();
        document.getElementById('apiKeyInput').focus();
      }
    }

    function saveKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) localStorage.setItem('bookSummaryApiKey', val);
      else localStorage.removeItem('bookSummaryApiKey');
      document.getElementById('keyRow').classList.remove('visible');
      updateKeyStatus();
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = msg ? 'block' : 'none';
    }

    function setButtons(disabled) {
      document.querySelectorAll('.buttons button').forEach(b => b.disabled = disabled);
    }

    async function query(type) {
      const title = document.getElementById('bookTitle').value.trim();
      if (!title) { showError('Please enter a book title.'); return; }

      const key = getKey();
      if (!key) { showError('Please save your API key first (see below).'); return; }

      showError('');
      const resultBox = document.getElementById('resultBox');
      const resultText = document.getElementById('resultText');
      const resultLabel = document.getElementById('resultLabel');

      resultLabel.textContent = LABELS[type];
      resultText.innerHTML = '<span class="cursor"></span>';
      resultBox.classList.add('visible');
      setButtons(true);

      try {
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
          },
          body: JSON.stringify({
            model: 'claude-opus-4-6',
            max_tokens: 16000,
            stream: true,
            messages: [{ role: 'user', content: PROMPTS[type](title) }],
          }),
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.error?.message || `HTTP ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let accumulated = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6).trim();
            if (data === '[DONE]') continue;

            try {
              const parsed = JSON.parse(data);
              if (parsed.type === 'content_block_delta' && parsed.delta?.type === 'text_delta') {
                accumulated += parsed.delta.text;
                resultText.textContent = accumulated;
              }
            } catch {}
          }
        }

      } catch (err) {
        showError('Error: ' + err.message);
        resultBox.classList.remove('visible');
      } finally {
        setButtons(false);
      }
    }

    // Allow Enter key on book title input
    document.getElementById('bookTitle').addEventListener('keydown', e => {
      if (e.key === 'Enter') query('synopsis');
    });

    updateKeyStatus();
  </script>
</body>
</html>
