<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Summary</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, serif;
      background: #ffffff;
      color: #3d2b1f;
      min-height: 100vh;
      padding: 0 0 40px 0;
    }

    .banner {
      width: 100%;
      display: block;
      margin-bottom: 32px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28pt;
      color: #3d2b1f;
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #7B6D8D;
      font-size: 13px;
      margin-bottom: 36px;
      font-family: Arial, sans-serif;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      font-family: Georgia, serif;
      border: 1.5px solid #c5b8a8;
      border-radius: 4px;
      background: #fff;
      color: #3d2b1f;
      margin-bottom: 16px;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #1B2A4A;
    }

    .error {
      color: #c0392b;
      font-size: 13px;
      margin-bottom: 12px;
      font-family: Arial, sans-serif;
      display: none;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 14px 20px;
      font-size: 15px;
      font-family: Georgia, serif;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      text-align: left;
      transition: background 0.15s;
    }

    .btn-characters { background: #1B2A4A; color: white; }
    .btn-characters:hover { background: #2a3f6a; }

    .btn-synopsis { background: #4A7C59; color: white; }
    .btn-synopsis:hover { background: #3a6147; }

    .btn-spoilers { background: #7B6D8D; color: white; }
    .btn-spoilers:hover { background: #63577a; }

    .note {
      margin-top: 28px;
      font-size: 12px;
      color: #999;
      text-align: center;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <img class="banner" src="BookBorder3.jpg" alt="">
  <div class="container" style="padding: 0 20px;">
    <h1>Book Summary</h1>
    <p class="subtitle">Enter a book title and choose what you'd like to know</p>

    <input type="text" id="bookTitle" placeholder="Enter book title..." />
    <div class="error" id="errorMsg">Please enter a book title.</div>

    <div class="buttons">
      <button class="btn-characters" onclick="openClaude('characters')">List of Characters (no spoilers)</button>
      <button class="btn-synopsis" onclick="openClaude('synopsis')">Synopsis</button>
      <button class="btn-spoilers" onclick="openClaude('spoilers')">Full Summary with Spoilers</button>
    </div>

    <p class="note">Opens Claude.ai in a new tab — just press Enter to get your answer.</p>
  </div>

  <script>
    const PROMPTS = {
      characters: (title) =>
        `The book "${title}" — list the main and supporting characters. For each character provide their name and a brief description of who they are and their role in the story. No spoilers please.`,
      synopsis: (title) =>
        `The book "${title}" — give me a brief synopsis in 2-3 paragraphs. No major spoilers.`,
      spoilers: (title) =>
        `The book "${title}" — give me a detailed summary including all major plot points, character arcs, key twists, and the ending. Include spoilers.`,
    };

    function openClaude(type) {
      const title = document.getElementById('bookTitle').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (!title) {
        errorMsg.style.display = 'block';
        document.getElementById('bookTitle').focus();
        return;
      }

      errorMsg.style.display = 'none';
      const prompt = PROMPTS[type](title);
      const url = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
      window.open(url, '_blank');
    }

    document.getElementById('bookTitle').addEventListener('keydown', e => {
      if (e.key === 'Enter') openClaude('synopsis');
      document.getElementById('errorMsg').style.display = 'none';
    });
  </script>
</body>
</html>
